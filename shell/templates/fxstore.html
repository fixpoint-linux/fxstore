<!--
  shell/templates/fxstore.html — the route template for '/fxstore'.

  The [data-mfe="fxstore-page"] element is the slot the shell's reconcile
  mounts the Elm fxstore MFE into, and — on the statically pre-rendered page —
  the exact element that scripts/ssg.mjs fills with the Elm view at build time.
  The empty slot here mirrors the one embedded in shell/index.html so a
  client-side re-render (non-SSR path) produces the same structure.
-->
<div class="fixpoint-root">
  <div data-mfe="fxstore-page"></div>
</div>
